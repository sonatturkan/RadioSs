; RadioS yapılandırması — C okuyucu ve yerel veritabanı servis yöneticisi bu dosyayı okur.
; Göreli yollar çalışma dizinine göre değil, RadioS proje köküne göre çözülür.
; Gerçek kullanıcı, istasyon, uç UUID'si veya token bu örnekte bulunmaz.

[application]
config_version = 1
name = RadioS
initial_profile = broadcast
auto_start_playback = false

[paths]
assets_root = assets
database_file = data/database/RadioS.sdb
endpoint_root = data/endpoints
import_root = data/imports
cache_root = data/cache
log_root = data/logs
recording_root = data/recordings
backup_root = data/backups

[database]
source_dir = database/SDBASE
service_url = http://127.0.0.1:8000
python_command = python3
token_environment = RADIOS_SDBASE_TOKEN
connect_timeout_seconds = 5
request_timeout_seconds = 30

[audio]
; Boş değer, cihazın henüz atanmadığını belirtir.
main_device_id =
cue_device_id =
monitor_device_id =
